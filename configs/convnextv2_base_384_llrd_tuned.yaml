experiment_name: "convnextv2_base_384_llrd_tuned"
model:
  backbone: "convnextv2_base.fcmae_ft_in22k_in1k"
  image_size: 384
  pooling: "gap"
train:
  batch_size: 16
  epochs: 15
  base_lr: 0.0005
  backbone_lr_factor: 0.1
  pos_weight_mode: "dynamic"
augmentation:
  coarse_dropout:
    enabled: true
    max_holes: 4
    max_height: 48
    max_width: 48
